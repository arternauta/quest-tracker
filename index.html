<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quest Tracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- HUD HEADER -->
  <header class="hud-header">
    <div class="hero-left">
      <svg class="link-sprite" width="40" height="70" viewBox="0 0 8 14" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
        <!-- hat -->
        <rect x="2" y="0" width="4" height="1" fill="#00a800"/>
        <rect x="1" y="1" width="6" height="1" fill="#00a800"/>
        <rect x="0" y="2" width="8" height="1" fill="#00a800"/>
        <!-- face -->
        <rect x="1" y="3" width="6" height="1" fill="#f8c878"/>
        <rect x="1" y="4" width="6" height="1" fill="#f8c878"/>
        <rect x="2" y="4" width="1" height="1" fill="#001818"/>
        <rect x="5" y="4" width="1" height="1" fill="#001818"/>
        <rect x="1" y="5" width="6" height="1" fill="#f8c878"/>
        <rect x="1" y="6" width="6" height="1" fill="#f8c878"/>
        <rect x="3" y="6" width="2" height="1" fill="#001818"/>
        <!-- hat sides over face -->
        <rect x="0" y="4" width="1" height="3" fill="#00a800"/>
        <rect x="7" y="4" width="1" height="3" fill="#00a800"/>
        <!-- shoulders + body -->
        <rect x="1" y="7" width="6" height="1" fill="#00a800"/>
        <rect x="0" y="8" width="8" height="1" fill="#00a800"/>
        <rect x="3" y="8" width="2" height="1" fill="#6c4000"/>
        <rect x="0" y="9" width="8" height="1" fill="#00a800"/>
        <!-- hands -->
        <rect x="0" y="10" width="8" height="1" fill="#00a800"/>
        <rect x="0" y="10" width="1" height="1" fill="#f8c878"/>
        <rect x="7" y="10" width="1" height="1" fill="#f8c878"/>
        <!-- legs -->
        <rect x="2" y="11" width="2" height="1" fill="#00a800"/>
        <rect x="4" y="11" width="2" height="1" fill="#00a800"/>
        <!-- boots -->
        <rect x="2" y="12" width="2" height="2" fill="#6c4000"/>
        <rect x="4" y="12" width="2" height="2" fill="#6c4000"/>
      </svg>
      <div class="hero-text">
        <div class="hero-name">Arternauta</div>
        <div class="hero-title">Full Stack Adventurer</div>
      </div>
    </div>
    <div class="hero-stats">
      <div class="hero-stat">
        <span class="label">LEVEL</span>
        <span class="value" id="hero-level">—</span>
      </div>
      <div class="hero-stat">
        <span class="label">TOTAL XP</span>
        <span class="value" id="hero-xp">—</span>
      </div>
    </div>
  </header>

  <!-- FILTERS -->
  <div class="filters">
    <button class="filter-btn active" data-filter="all">ALL QUESTS</button>
    <button class="filter-btn" data-filter="active">ACTIVE</button>
    <button class="filter-btn" data-filter="backlog">BACKLOG</button>
    <button class="filter-btn" data-filter="paused">PAUSED</button>
    <button class="filter-btn" data-filter="completed">COMPLETED</button>
    <button class="filter-btn" data-filter="code">CODE</button>
    <button class="filter-btn" data-filter="work">WORK</button>
  </div>

  <!-- QUEST GRID -->
  <main class="quest-grid" id="quest-grid"></main>

  <!-- DIALOG MODAL -->
  <div id="dialog-overlay" onclick="closeModal()">
    <div class="dialog-box" onclick="event.stopPropagation()">
      <div class="dialog-name" id="dialog-name"></div>
      <pre class="dialog-body" id="dialog-body"></pre>
      <div class="dialog-cursor" id="dialog-cursor">▼</div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
